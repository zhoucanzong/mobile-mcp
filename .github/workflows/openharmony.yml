name: OpenHarmony validation

on:
  push:
    branches: [OpenHarmony]
  pull_request:
    branches: [OpenHarmony]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      # Phase one exercises mocked HDC/MCP behavior, not a physical phone.
      - name: Unit and protocol tests
        env:
          MOBILEMCP_DISABLE_TELEMETRY: '1'
        run: npm test -- --reporter=dot
      - name: Native recorder lifecycle tests
        run: |
          cmake -S native/harmony-recorder -B /tmp/mobile-mcp-recorder-tests -DMOBILE_MCP_HOST_TESTS=ON
          cmake --build /tmp/mobile-mcp-recorder-tests
          ctest --test-dir /tmp/mobile-mcp-recorder-tests --output-on-failure
      - name: Native location lifecycle tests
        run: |
          cmake -S native/harmony-location -B /tmp/mobile-mcp-location-tests
          cmake --build /tmp/mobile-mcp-location-tests
          ctest --test-dir /tmp/mobile-mcp-location-tests --output-on-failure
